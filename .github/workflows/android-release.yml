name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      release_tag:
        description: Temporary one-time validation tag; absent on normal tag pushes
        required: false
        type: string
    secrets:
      W2FULL_DEBUG_KEYSTORE_BASE64:
        required: true
      W2FULL_DEBUG_KEYSTORE_PASSWORD:
        required: true
      W2FULL_DEBUG_KEY_ALIAS:
        required: true
      W2FULL_DEBUG_KEY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  release-debug-apk:
    runs-on: ubuntu-latest
    env:
      W2FULL_DEBUG_KEYSTORE_BASE64: ${{ secrets.W2FULL_DEBUG_KEYSTORE_BASE64 }}
      W2FULL_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.W2FULL_DEBUG_KEYSTORE_PASSWORD }}
      W2FULL_DEBUG_KEY_ALIAS: ${{ secrets.W2FULL_DEBUG_KEY_ALIAS }}
      W2FULL_DEBUG_KEY_PASSWORD: ${{ secrets.W2FULL_DEBUG_KEY_PASSWORD }}
      W2FULL_EXPECTED_CERT_SHA256: bd7e570922bbadbe22d553bade91493d6309172a8b8d46e317db98f5f0b66265
      W2FULL_EXPECTED_PUBLIC_KEY_SHA256: 90e1ce512cd08a6d177bdb8199d3228ff6fb0e81adb625ad43275fc275963313

    steps:
      - name: Resolve Release tag
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_RELEASE_TAG:-}" ]]; then
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          [[ "$RELEASE_TAG" == v* ]]
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Release tag: $RELEASE_TAG"

      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Require persistent debug signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            W2FULL_DEBUG_KEYSTORE_BASE64 \
            W2FULL_DEBUG_KEYSTORE_PASSWORD \
            W2FULL_DEBUG_KEY_ALIAS \
            W2FULL_DEBUG_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required persistent signing secret $name is missing. Release aborted."
              exit 1
            fi
          done

      - name: Restore persistent debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/w2full-debug.keystore"
          printf '%s' "$W2FULL_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "W2FULL_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Persistent debug keystore enabled for tagged release."

      - name: Run JVM tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and persistent signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          grep -F "certificate SHA-256 digest: $W2FULL_EXPECTED_CERT_SHA256" <<< "$VERIFY_OUTPUT"
          grep -F "public key SHA-256 digest: $W2FULL_EXPECTED_PUBLIC_KEY_SHA256" <<< "$VERIFY_OUTPUT"
          echo "Persistent signing certificate verified: $W2FULL_EXPECTED_CERT_SHA256"
          echo "Persistent public key verified: $W2FULL_EXPECTED_PUBLIC_KEY_SHA256"

      - name: Prepare versioned Release APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p dist
          RELEASE_APK="dist/w2full-${RELEASE_TAG}-debug.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          test -s "$RELEASE_APK"
          APK_SHA256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$RELEASE_APK"
          echo "APK SHA-256: $APK_SHA256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: W2Full ${{ env.RELEASE_TAG }}
          body: |
            W2Full debug — `${{ env.RELEASE_TAG }}`

            Build taggata dal commit `${{ github.sha }}`.

            - Test JVM: superati prima della pubblicazione
            - Build debug APK: riuscita
            - Firma persistente certificato SHA-256: `${{ env.W2FULL_EXPECTED_CERT_SHA256 }}`
            - Firma persistente public key SHA-256: `${{ env.W2FULL_EXPECTED_PUBLIC_KEY_SHA256 }}`
            - APK SHA-256: `${{ steps.package.outputs.apk_sha256 }}`
          prerelease: ${{ contains(env.RELEASE_TAG, 'preview') || contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') }}
          fail_on_unmatched_files: true
          files: ${{ steps.package.outputs.release_apk }}
